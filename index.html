<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunsplash Cove</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1aa0ff">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#3ab8ff;color:#fff;
    font-family:"Luckiest Guy","Marker Felt","Chalkboard SE","Comic Sans MS",Impact,sans-serif;letter-spacing:.5px;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;filter:saturate(1.35) contrast(1.08)}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,0) 55%,rgba(0,60,160,.28) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;background:#bff4ff;opacity:0;transition:opacity .5s}
  #touch{position:fixed;inset:0;touch-action:none}
  .ol{text-shadow:-2px -2px 0 #0a3a9a,2px -2px 0 #0a3a9a,-2px 2px 0 #0a3a9a,2px 2px 0 #0a3a9a,0 4px 0 #062a70}
  #hud{position:fixed;left:0;right:0;top:0;pointer-events:none;display:none;
    padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px);font-size:20px}
  #hudrow{display:flex;align-items:center;gap:10px}
  #lvl{color:#fff;white-space:nowrap}
  #stars{color:#ffe14a;white-space:nowrap}
  #bar{flex:1;height:12px;border-radius:8px;background:rgba(0,60,150,.45);border:2px solid #fff;position:relative}
  #barfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:linear-gradient(90deg,#ffe14a,#ff7a1a)}
  #barend{position:absolute;right:-8px;top:-10px;font-size:20px}
  .rb{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:rgba(0,90,200,.55);
    color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
  #toast{position:fixed;left:0;right:0;top:20%;text-align:center;font-size:32px;pointer-events:none;opacity:0;transition:opacity .4s;padding:0 20px;color:#ffe14a}
  #jump{position:fixed;right:calc(env(safe-area-inset-right) + 22px);bottom:calc(env(safe-area-inset-bottom) + 34px);
    width:94px;height:94px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:24px;
    background:radial-gradient(circle at 35% 30%,#fff7a8,#ffb21a 55%,#ff5a1a);
    border:3px solid #fff;box-shadow:0 6px 0 rgba(0,50,140,.5),inset 0 0 14px rgba(255,255,255,.5);touch-action:none;opacity:.92}
  #jump.on{transform:translateY(4px) scale(.95);box-shadow:0 2px 0 rgba(0,50,140,.5)}
  #stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;pointer-events:none;display:none;
    border:3px solid rgba(255,255,255,.85);background:rgba(0,110,220,.25)}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#5ad0ff 60%,#0a7ae0);border:2px solid #fff}
  #hint{position:fixed;left:calc(env(safe-area-inset-left) + 26px);bottom:calc(env(safe-area-inset-bottom) + 60px);font-size:18px;pointer-events:none;display:none}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px);box-sizing:border-box;
    background:radial-gradient(ellipse at 50% 40%,rgba(0,120,255,.05),rgba(0,70,190,.45))}
  h1{font-size:clamp(50px,15vw,110px);margin:0;line-height:.92;font-weight:400;color:#ffe14a;transform:rotate(-4deg);
    text-shadow:-3px -3px 0 #ff5a1a,3px -3px 0 #ff5a1a,-3px 3px 0 #ff5a1a,3px 3px 0 #ff5a1a,0 8px 0 #c21a6a,0 12px 0 rgba(0,40,120,.5)}
  .sub{font-size:22px;margin:22px 0 6px}
  .small{font-size:15px;max-width:340px;line-height:1.35;font-family:-apple-system,system-ui,sans-serif;font-weight:700;letter-spacing:0;text-shadow:0 1px 3px rgba(0,40,120,.9)}
  .btn{margin-top:18px;font:inherit;font-size:30px;color:#fff;padding:12px 40px 8px;border-radius:40px;border:3px solid #fff;
    background:linear-gradient(180deg,#ff6ab0,#ff2a7a);box-shadow:0 6px 0 #b0104a,0 10px 18px rgba(0,40,120,.4);touch-action:manipulation;
    text-shadow:0 2px 0 #b0104a}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b0104a}
  #grid{display:grid;grid-template-columns:repeat(5,52px);gap:8px;margin-top:18px}
  #grid button{font:inherit;font-size:22px;height:52px;border-radius:14px;border:3px solid #fff;color:#fff;padding-top:4px;
    background:linear-gradient(180deg,#3ad0ff,#0a8ae0);box-shadow:0 4px 0 #0a5aa0;touch-action:manipulation}
  #grid button[disabled]{background:rgba(0,60,140,.45);box-shadow:none;border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.45)}
  #clear{display:none}
  #err{position:fixed;left:10px;right:10px;bottom:10px;color:#a00;font:12px monospace;pointer-events:none;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="touch"></div>
<div id="hud"><div id="hudrow">
  <div id="lvl" class="ol">1/10</div>
  <div id="stars" class="ol">★ 0/0</div>
  <div id="bar"><div id="barfill"></div><div id="barend">🏁</div></div>
  <div id="menu" class="rb">☰</div>
  <div id="mute" class="rb">♪</div>
</div></div>
<div id="toast" class="ol"></div>
<div id="hint" class="ol">drag here to walk</div>
<div id="stick"><div id="knob"></div></div>
<div id="jump" class="ol">JUMP</div>

<div id="title" class="screen">
  <h1>Sunsplash<br>Cove</h1>
  <div class="sub ol">Hop the docks. Reach the flag.</div>
  <div class="small">Left thumb walks · right thumb looks · JUMP to leap. Don't fall in!<br>Keyboard: WASD + mouse + space.</div>
  <button id="start" class="btn">Play</button>
  <div id="grid"></div>
</div>
<div id="clear" class="screen">
  <h1 id="cleartitle" style="font-size:clamp(44px,13vw,96px)">Level clear!</h1>
  <div class="sub ol" id="clearstats"></div>
  <div class="small" id="clearbest"></div>
  <button id="next" class="btn">Next level</button>
</div>
<div id="err"></div>

<script src="three.min.js"></script>
<script>
"use strict";
window.addEventListener('error',e=>{document.getElementById('err').textContent+=e.message+'\n'});
const $=id=>document.getElementById(id);
const TAU=Math.PI*2, lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const rr=(a,b)=>a+(b-a)*rnd();

/* ---------- procedural textures ---------- */
const h2=(x,y,s=0)=>{const n=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453;return n-Math.floor(n)};
function vnoise(x,y,per,s){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi;
  const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),m=a=>((a%per)+per)%per;
  const a=h2(m(xi),m(yi),s),b=h2(m(xi+1),m(yi),s),c=h2(m(xi),m(yi+1),s),d=h2(m(xi+1),m(yi+1),s);
  return lerp(lerp(a,b,u),lerp(c,d,u),v)}
function fbm(u,v,per=4,s=0,oct=4){let t=0,a=.5,p=per;for(let o=0;o<oct;o++){t+=a*vnoise(u*p,v*p,p,s+o);a*=.5;p*=2}return t/.9375}
function mkTex(size,fn,rx=1,ry=1){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  const im=g.createImageData(size,size),d=im.data;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const p=fn(x/size,y/size),i=(y*size+x)*4;
    d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=p.length>3?p[3]:255}
  g.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t}
function drawTex(w,h,fn,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);
  if(rx){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry||rx)}return t}
function voro(u,v,N,s){let x=u*N,y=v*N,xi=Math.floor(x),yi=Math.floor(y),d1=9,d2=9,id=0;
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const cx=xi+i,cy=yi+j,mx=((cx%N)+N)%N,my=((cy%N)+N)%N;
    const px=cx+.15+.7*h2(mx,my,s),py=cy+.15+.7*h2(mx,my,s+9),d=Math.hypot(px-x,py-y);
    if(d<d1){d2=d1;d1=d;id=h2(mx,my,s+3)}else if(d<d2)d2=d}
  return [d1,d2,id]}
const stripes=(cols,n=8)=>drawTex(64,64,(g,w,h)=>{for(let i=0;i<n;i++){g.fillStyle=cols[i%cols.length];g.fillRect(i*w/n,0,w/n+1,h)}},1,1);

const T={};
T.sand=mkTex(128,(u,v)=>{const n=fbm(u,v,8,1),sp=h2(u*128,v*128,2);let k=.82+.3*n;
  let r=250*k,g=222*k,b=150*k; if(sp>.94){r*=.8;g*=.78;b*=.7} if(sp<.04){r=255;g=250;b=215} return [r,g,b]},3,3);
T.wood=mkTex(64,(u,v)=>{const pl=(u*4)%1,n=fbm(u*.5,v*2,8,61+Math.floor(u*4)*3);const k=.6+.5*n;
  if(pl<.07)return [70,40,18]; return [205*k,140*k,72*k]});
T.trunk=mkTex(64,(u,v)=>{const ring=(v*10)%1,n=fbm(u,v,8,31,3);const k=(.55+.5*n)*(ring<.18?.55:1)*(.8+.3*ring);return [170*k,118*k,66*k]},1,2);
T.leaf=drawTex(32,64,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#c8e02a');gr.addColorStop(.35,'#3ac02a');gr.addColorStop(1,'#128a2a');
  g.fillStyle=gr;g.fillRect(0,0,w,h);g.strokeStyle='rgba(0,70,20,.55)';g.lineWidth=1.5;
  for(let y=-8;y<h+8;y+=5){g.beginPath();g.moveTo(w/2,y+6);g.lineTo(0,y);g.moveTo(w/2,y+6);g.lineTo(w,y);g.stroke()}
  g.strokeStyle='#e0f060';g.lineWidth=2;g.beginPath();g.moveTo(w/2,0);g.lineTo(w/2,h);g.stroke()});
T.rock=mkTex(64,(u,v)=>{const n=fbm(u,v,6,21),m=fbm(u,v,12,23,3);const k=.5+.8*n*m*1.6;return [165*k,150*k,135*k]},2,2);
T.thatch=mkTex(64,(u,v)=>{const n=fbm(u*4,v*.3,8,71),row=(v*4)%1;const k=(.6+.6*n)*(.7+.4*row);return [235*k,190*k,90*k]},3,1);
T.crate=drawTex(64,64,(g,w,h)=>{g.fillStyle='#d89a48';g.fillRect(0,0,w,h);g.strokeStyle='#8a5a20';g.lineWidth=1;for(let y=10;y<h;y+=10){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
  g.strokeStyle='#a86a28';g.lineWidth=8;g.strokeRect(4,4,w-8,h-8);g.lineWidth=6;g.beginPath();g.moveTo(6,6);g.lineTo(w-6,h-6);g.moveTo(w-6,6);g.lineTo(6,h-6);g.stroke()});
T.checker=drawTex(64,32,(g,w,h)=>{for(let y=0;y<4;y++)for(let x=0;x<8;x++){g.fillStyle=(x+y)%2?'#fff':'#111';g.fillRect(x*8,y*8,8,8)}});
T.water=mkTex(128,(u,v)=>{const [d1,d2]=voro(u,v,5,4),[e1,e2]=voro(u+.37,v+.21,8,9);const e=clamp(1-(d2-d1)*5,0,1),f=clamp(1-(e2-e1)*5,0,1)*.4;const k=clamp(e*e+f,0,1);
  return [lerp(0,150,k),lerp(160,245,k),lerp(222,255,k)]});
T.caus=mkTex(128,(u,v)=>{const [d1,d2]=voro(u,v,6,14);const e=clamp(1-(d2-d1)*7,0,1);return [255,255,255,255*e*e]});
T.glow=drawTex(64,64,(g)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)});
T.spark=drawTex(64,64,(g)=>{g.translate(32,32);const gr=g.createRadialGradient(0,0,0,0,0,30);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,255,255,.3)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(-32,-32,64,64);g.fillStyle='#fff';g.beginPath();for(let i=0;i<8;i++){const a=i*TAU/8,r=i%2?3:31;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.fill()});
T.starfish=drawTex(64,64,(g)=>{g.translate(32,32);g.fillStyle='#ff7a1a';g.strokeStyle='#fff';g.lineWidth=3;g.lineJoin='round';g.beginPath();
  for(let i=0;i<10;i++){const a=i*TAU/10-Math.PI/2,r=i%2?12:29;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.stroke();g.fill();
  g.fillStyle='#ffe14a';g.beginPath();for(let i=0;i<10;i++){const a=i*TAU/10-Math.PI/2,r=i%2?7:19;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(-5,-6,4,0,TAU);g.fill()});
T.cloud=drawTex(128,64,(g)=>{for(let i=0;i<16;i++){const x=20+rnd()*88,y=30+rnd()*18,r=10+rnd()*16;const gr=g.createRadialGradient(x,y-r*.2,0,x,y,r);
  gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.6,'rgba(255,255,255,.6)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,64)}});
T.ray=drawTex(32,64,(g,w,h)=>{const gr=g.createLinearGradient(0,h,0,0);gr.addColorStop(0,'#ff7a00');gr.addColorStop(.5,'#ffb400');gr.addColorStop(1,'rgba(255,230,80,0)');g.fillStyle=gr;
  g.beginPath();g.moveTo(2,h);g.bezierCurveTo(0,h*.5,w*.3,h*.3,w*.6,0);g.bezierCurveTo(w*.8,h*.35,w,h*.6,w-2,h);g.fill()});
T.umb=stripes(['#ff2a4a','#ffffff'],8);T.umb2=stripes(['#ffd21a','#1a8aff'],8);
T.ball=stripes(['#ff2a4a','#ffffff','#ffd21a','#ffffff','#1a8aff','#ffffff'],6);
const raftTex=[stripes(['#ff3a5a','#fff'],6),stripes(['#ffd21a','#1a7aff'],6),stripes(['#ff6ad0','#3ae0e0'],6),stripes(['#3ad04a','#fff'],6)];
const boardTex=[['#ff2a7a','#ffe14a'],['#1ad0c0','#fff'],['#ff7a1a','#fff'],['#8a3aff','#ffe14a']].map(c=>drawTex(32,64,(g,w,h)=>{g.fillStyle=c[0];g.fillRect(0,0,w,h);g.fillStyle=c[1];g.fillRect(w*.42,0,w*.16,h);g.fillRect(0,h*.2,w,h*.08)}));

/* ---------- renderer / scene ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
const scene=new THREE.Scene();
const FOGC=new THREE.Color(0xa6e8ff);
scene.fog=new THREE.FogExp2(FOGC,0.0042);
const camera=new THREE.PerspectiveCamera(90,1,0.1,1400);
camera.rotation.order='YXZ';
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(Math.max(.5,Math.min(devicePixelRatio||1,640/Math.max(w,h))));
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?96:72;camera.updateProjectionMatrix()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();

const SUN=new THREE.Vector3(.2,.44,-1).normalize();
scene.add(new THREE.HemisphereLight(0xffffff,0x4ac8e0,.78));
const sunL=new THREE.DirectionalLight(0xfff0c8,.62);sunL.position.set(.3,1,-.35);scene.add(sunL);
const fillL=new THREE.DirectionalLight(0xffffff,.28);fillL.position.set(-.4,.5,1);scene.add(fillL);

const M=(map,o={})=>new THREE.MeshPhongMaterial(Object.assign({map,specular:0x222222,shininess:12},o));
const shiny={specular:0xffffff,shininess:70};
const mat={sand:M(T.sand,{color:0xd8c8a8}),wood:M(T.wood),trunk:M(T.trunk),leaf:M(T.leaf,{side:THREE.DoubleSide,specular:0x88aa44,shininess:30}),rock:M(T.rock),thatch:M(T.thatch),
  crate:M(T.crate),checker:new THREE.MeshBasicMaterial({map:T.checker,side:THREE.DoubleSide}),umb:M(T.umb,shiny),umb2:M(T.umb2,shiny),ball:M(T.ball,shiny),
  white:new THREE.MeshPhongMaterial(Object.assign({color:0xffffff},shiny)),coco:new THREE.MeshPhongMaterial({color:0x6a3a14}),
  pole:new THREE.MeshPhongMaterial(Object.assign({color:0xf4f4f4},shiny)),red:new THREE.MeshPhongMaterial(Object.assign({color:0xff2a3a},shiny)),
  dolphin:new THREE.MeshPhongMaterial(Object.assign({color:0x5a8ac0},shiny))};
const raftMat=raftTex.map(t=>M(t,shiny)),boardMat=boardTex.map(t=>M(t,shiny));
const sprMat=(map,color,o={})=>new THREE.SpriteMaterial(Object.assign({map,color,depthWrite:false,transparent:true},o));
const add=(m,x,y,z,p)=>{m.position.set(x,y,z);p.add(m);return m};
const SH=g=>{g.userData.shared=true;return g};

/* sky */
const skyG=new THREE.Group();scene.add(skyG);
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{sd:{value:SUN}},
 vertexShader:`varying vec3 d;void main(){d=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`precision highp float;varying vec3 d;uniform vec3 sd;
 void main(){vec3 r=normalize(d);float y=r.y;
  vec3 c=mix(vec3(.65,.91,1.),vec3(.0,.32,.98),smoothstep(0.,.7,y));
  c=mix(c,vec3(.65,.91,1.),smoothstep(.02,-.05,y));
  float s=max(dot(r,sd),0.);c+=vec3(1.,.85,.4)*pow(s,10.)*.45+vec3(1.,.95,.7)*pow(s,60.)*.5;
  gl_FragColor=vec4(c,1.);}`});
const sky=new THREE.Mesh(new THREE.SphereGeometry(1000,24,16),skyMat);sky.renderOrder=-10;skyG.add(sky);
for(let i=0;i<14;i++){const a=rnd()*TAU,e=rr(.08,.42),s=rr(260,460);const c=new THREE.Sprite(sprMat(T.cloud,0xffffff,{fog:false,opacity:.95}));
  c.scale.set(s,s*.5,1);add(c,Math.cos(a)*900*Math.cos(e),900*Math.sin(e),Math.sin(a)*900*Math.cos(e),skyG)}
// the sun
const sunG=new THREE.Group();const rays=[];{
  const fl=new THREE.Sprite(sprMat(T.glow,0xfff0a0,{fog:false,blending:THREE.AdditiveBlending,opacity:.5}));fl.scale.set(460,460,1);fl.position.z=-30;sunG.add(fl);
  for(let i=0;i<12;i++){const r=new THREE.Mesh(new THREE.PlaneGeometry(44,80),new THREE.MeshBasicMaterial({map:T.ray,transparent:true,depthWrite:false,fog:false}));
    const a=i/12*TAU;r.position.set(Math.cos(a)*86,Math.sin(a)*86,-4);r.rotation.z=a-Math.PI/2;sunG.add(r);rays.push(r)}
  const body=new THREE.Mesh(new THREE.SphereGeometry(60,24,18),new THREE.MeshPhongMaterial({color:0xff9a10,emissive:0xd05a00,specular:0xffffaa,shininess:40,fog:false}));sunG.add(body);
  const lensM=new THREE.MeshPhongMaterial({color:0x0a1a8a,emissive:0x061060,specular:0xffffff,shininess:120,fog:false});
  [-1,1].forEach(k=>{const l=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),lensM);l.scale.set(25,16,9);l.position.set(k*25,14,50);l.rotation.z=-k*.12;sunG.add(l);
    const sp=new THREE.Sprite(sprMat(T.spark,0xffffff,{fog:false,blending:THREE.AdditiveBlending}));sp.scale.set(30,30,1);sp.position.set(k*25-7,19,62);sunG.add(sp);rays.push(sp)});
  const br=new THREE.Mesh(new THREE.BoxGeometry(14,5,5),lensM);br.position.set(0,18,57);sunG.add(br);

function taperTube(pts,r0,r1,seg=8){const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));
  const g=new THREE.TubeGeometry(curve,seg,1,7,false),pos=g.attributes.position,v=new THREE.Vector3();
  for(let i=0;i<=seg;i++){const c=curve.getPointAt(i/seg),r=lerp(r0,r1,i/seg);
    for(let j=0;j<=7;j++){const k=i*8+j;v.fromBufferAttribute(pos,k).sub(c).multiplyScalar(r).add(c);pos.setXYZ(k,v.x,v.y,v.z)}}
  return g}

  for(let k=0;k<N;k++){const a=k/N*TAU+rr(-.2,.2),ca=Math.cos(a),sa=Math.sin(a),dr=rr(1.7,2.5),up=rr(.8,1.3);
    for(let j=0;j<=S;j++){const t=j/S,al=t*L,y=up*t-dr*t*t,hw=.62*Math.pow(Math.sin(Math.PI*(.07+.93*t)),.8);
      [[-hw,-.3*hw],[0,0],[hw,-.3*hw]].forEach((q,m)=>{pos.push(q[0]*ca+al*sa,y+q[1],-q[0]*sa+al*ca);uv.push(m/2,t)});

    base+=(S+1)*3}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g})());

  for(const b of boats){b.x+=b.sp*dt;if(Math.abs(b.x)>170)b.sp*=-1;b.g.position.set(b.x,WATER+Math.sin(time+b.z)*.15,b.z);b.g.rotation.set(0,b.sp>0?0:Math.PI,Math.sin(time*.8+b.z)*.05)}
  for(const d of dolphins){const a=time*d.sp+d.ph;d.g.position.set(d.x+Math.cos(a)*3.2*Math.sign(d.x),WATER-1.3+Math.sin(a)*3,d.z);d.g.rotation.set(0,d.x>0?0:Math.PI,-(a+Math.PI/2))}
  for(const p of pickups){if(p.got)continue;const k=1.25+.2*Math.sin(time*4+p.ph);p.s.scale.set(k,k,1);p.s.position.y=p.gl.position.y=p.y+Math.sin(time*2+p.ph)*.2;p.s.material.rotation=Math.sin(time*2+p.ph)*.4}
  for(const s of spinners){s.material.rotation=time*1.2;const k=3.2+.6*Math.sin(time*5);s.scale.set(k,k,1)}
  for(const p of pads){p.sq*=Math.pow(.002,dt);p.mesh.scale.y=1-.6*p.sq;p.mesh.position.y=p.top-.25*p.sq}
  if(goal)goal.flag.rotation.y=Math.sin(time*4)*.35;
  renderer.render(scene,camera);
}
buildLevel(0);mkGrid();
window.__g={P,startLevel,botRun,get state(){return state},LEVELS};
requestAnimationFrame(frame);
</script>
